[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /music moved to the homepage. src/pages/music.astro already redirects, but in a
# static build that is only a meta-refresh — this gives search engines a real 301.
# force = true is required, otherwise the built /music/index.html wins.
[[redirects]]
  from = "/music"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/music/*"
  to = "/"
  status = 301
  force = true

# Security & Performance Headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: self, Google Fonts, YouTube embeds, SomaFM, Archive.org. No analytics.
    #
    # media-src is deliberately 'self' https: and not a host list. Radio stations
    # redirect to geo-balanced edge nodes with generated hostnames — NTS resolves to
    # audio-edge-<random>.<region>.h.radiomast.io, and that name changes. CSP
    # host-matches redirect targets, so any whitelist here silently kills streams
    # whenever a provider reshuffles its CDN. https: still blocks plaintext http.
    #
    # img-src/connect-src stay narrow: archive.org/download/* redirects to
    # ia######.us.archive.org, hence the *.archive.org wildcard.
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self' 'unsafe-inline'; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data: https://img.youtube.com https://i.ytimg.com https://*.somafm.com https://somafm.com https://archive.org https://*.archive.org; \
      media-src 'self' https:; \
      frame-src https://www.youtube.com https://www.youtube-nocookie.com https://archive.org; \
      connect-src 'self' https://somafm.com https://*.somafm.com https://archive.org https://*.archive.org; \
      base-uri 'self'; \
      form-action 'self'; \
      object-src 'none'; \
      frame-ancestors 'self'\
      """

# Cache static assets aggressively
[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

# RSS Feed content-type
[[headers]]
  for = "/sotd/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
